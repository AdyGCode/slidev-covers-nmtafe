
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Slidev Covers Dashboard</title>
<style>
body{font-family:sans-serif;margin:2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,200px);gap:1rem}
.card{border:1px solid #ccc;padding:.5rem}
img{width:100%;height:120px;object-fit:cover}
</style>
</head>
<body>
<h1>Approved Slidev Covers</h1>
<p>This dashboard lists all faculty‑approved images.</p>
<div id="grid" class="grid"></div>
<script>
fetch('index.json').then(r=>r.json()).then(m=>{
 const g=document.getElementById('grid')
 Object.entries(m).forEach(([cat,imgs])=>{
   imgs.forEach(src=>{
     const d=document.createElement('div')
     d.className='card'
     d.innerHTML=`<small>${cat}</small><img src="${src}"/><small>${src.split('/').pop()}</small>`
     g.appendChild(d)
   })
 })
})
</script>
</body>
</html>
