<!DOCTYPE html>
<html>
<head Cover Resolver</title><head>
</head>
<body>
<script>
    (async () => {
        const base = location.origin + location.pathname.replace(/\/cover.*$/, '/')
        const manifestUrl = base + 'index.json'

        const path = location.pathname
            .replace(/^.*\/cover\/?/, '')
            .replace(/\/$/, '')

        const res = await fetch(manifestUrl)
        const manifest = await res.json()
        const categories = Object.keys(manifest)

        const random = arr => arr[Math.floor(Math.random() * arr.length)]

        let image

        if (!path) {
            const cat = random(categories)
            image = random(manifest[cat])
        } else {
            const parts = path.split('/')
            const [category, name] = parts

            if (!manifest[category]) {
                const cat = random(categories)
                image = random(manifest[cat])
            } else if (!name) {
                image = random(manifest[category])
            } else {
                const match = manifest[category].find(p =>
                    p.includes(`/${name}.`)
                )
                image = match ?? random(manifest[category])
            }
        }

        location.replace(base + image)
    })()
</script>
</body>
</html>
<meta charset="utf-8" />
