<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Slidev Cover Resolver</title>

    <!-- Fallback: immediate redirect -->
    <meta http-equiv="refresh" content="0; url=./_bootstrap.png">

    <script>
        (async () => {
            const base = location.origin + location.pathname.replace(/\/cover.*$/, '/')
            const manifest = await fetch(base + 'index.json').then(r => r.json())

            const cats = Object.keys(manifest)
            const random = a => a[Math.floor(Math.random() * a.length)]
            const chosen = random(manifest[random(cats)])

            location.replace(base + chosen)
        })()
    </script>
</head>
<body></body>
</html>
